<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free fire </title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#101820,#243b55);
  color:white;

input{
  width:100%;

.logout{

  display:none;

  display:inline-block;

.success{

}

.error{

}

  width:100%;

</head>

<body>

<div class="header">
  <h1>🎁 free dimond</h1>
  <p>Admin & Worker Entry System</p>
  <p class="note">Demo / Private Reward Management</p>
</div>

<div class="container">

<!-- LOGIN -->

<div class="card" id="loginBox">

<h2>🔐 Login</h2>

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<button
class="btn"
onclick="login()">

LOGIN

</button>

<p id="loginMsg"></p>

</div>


<!-- APP -->

<div id="app">

<div class="card">

<h2>👤 Account</h2>

<p>
Logged in:
<b id="userEmail"></b>
</p>

<p>
Worker Username:
<b id="workerUsername"></b>
</p>

<span
class="badge"
id="role">
</span>

<br><br>

<button
class="logout"
onclick="logout()">

LOGOUT

</button>

</div>


<!-- ENTRY -->

<div class="card">

<h2>📝 Reward Entry</h2>

<p>
Worker:
<b id="entryWorker"></b>
</p>

<input
id="password"
placeholder="Player UID">

<input
id="rewardAmount"
type="number"
placeholder="Reward Amount">

<button
class="btn"
onclick="saveEntry()">

💾 SAVE ENTRY

</button>

<p id="saveMsg"></p>

</div>


<!-- ADMIN -->

<div
class="card"
id="adminPanel">

<h2>👨‍💼 Admin Dashboard</h2>

<p>
Total Entries:
<b id="totalCount">0</b>
</p>

<div id="records">
Loading records...
</div>

</div>

</div>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
getFirestore,
collection,
addDoc,
getDocs
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig={

apiKey:
"AIzaSyCtbpXgCr73z6UN_digd0oQoKPwdDRH0_c",

authDomain:
"soumya-dairy.firebaseapp.com",

projectId:
"soumya-dairy",

storageBucket:
"soumya-dairy.firebasestorage.app",

messagingSenderId:
"546193027551",

appId:
"1:546193027551:web:4ad8d012f7c4cd1e21146a"

};


/* FIREBASE START */

const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* ADMIN EMAIL */

const ADMIN_EMAIL=
"im9208455049@gmail.com";


/* LOGIN */

window.login=
async function(){

const email=
document.getElementById("email")
.value.trim();

const password=
document.getElementById("password")
.value;

if(!email||!password){

document.getElementById("loginMsg")
.innerHTML=
'<span class="error">Email और Password भरें</span>';

return;

}

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(error){

document.getElementById("loginMsg")
.innerHTML=
'<span class="error">Login failed</span>';

}

};


/* LOGOUT */

window.logout=function(){

signOut(auth);

};


/* USER LOGIN CHECK */

onAuthStateChanged(
auth,
(user)=>{

if(!user){

document.getElementById(
"loginBox"
).style.display="block";

document.getElementById(
"app"
).style.display="none";

return;

}


document.getElementById(
"loginBox"
).style.display="none";

document.getElementById(
"app"
).style.display="block";


const username=
user.email.split("@")[0];


/* SHOW USERNAME */

document.getElementById(
"userEmail"
).innerText=
user.email;

document.getElementById(
"workerUsername"
).innerText=
username;

document.getElementById(
"entryWorker"
).innerText=
username;


/* ADMIN CHECK */

if(
user.email.toLowerCase()
===
ADMIN_EMAIL.toLowerCase()
){

document.getElementById(
"role"
).innerText=
"ADMIN";

document.getElementById(
"adminPanel"
).style.display=
"block";

loadRecords();

}

else{

document.getElementById(
"role"
).innerText=
"WORKER";

document.getElementById(
"adminPanel"
).style.display=
"none";

}

});


/* SAVE ENTRY */

window.saveEntry=
async function(){

const user=
auth.currentUser;

if(!user)return;


const username=
user.email.split("@")[0];


const playerUid=
document.getElementById(
"playerUid"
).value.trim();


const rewardAmount=
Number(
document.getElementById(
"rewardAmount"
).value
);


if(!playerUid||!rewardAmount){

document.getElementById(
"saveMsg"
).innerHTML=
'<span class="error">सभी जानकारी भरें</span>';

return;

}


try{

await addDoc(
collection(
db,
"rewardEntries"
),
{

workerUsername:
username,

workerEmail:
user.email,

workerUid:
user.uid,

playerUid:
playerUid,

rewardAmount:
rewardAmount,

createdAt:
new Date().toISOString()

}
);


document.getElementById(
"saveMsg"
).innerHTML=
'<span class="success">✅ Entry सफलतापूर्वक Save हो गई</span>';


document.getElementById(
"playerUid"
).value="";

document.getElementById(
"rewardAmount"
).value="";


}catch(error){

document.getElementById(
"saveMsg"
).innerHTML=
'<span class="error">❌ Entry Save नहीं हुई</span>';

}

};


/* ADMIN RECORDS */

async function loadRecords(){

const box=
document.getElementById(
"records"
);


try{

const snap=
await getDocs(
collection(
db,
"rewardEntries"
)
);


document.getElementById(
"totalCount"
).innerText=
snap.size;


let html=`

<table>

<tr>
<th>Worker</th>
<th>Player UID</th>
<th>Reward</th>
<th>Time</th>
</tr>

`;


snap.forEach(
(item)=>{

const d=
item.data();


let time="-";

if(d.createdAt){

time=
new Date(
d.createdAt
).toLocaleString();

}


html+=`

<tr>

<td>
${d.workerUsername||"-"}
</td>

<td>
${d.emai) password||"-"}
</td>

<td>
${d.password||"-"}
</td>

<td>
${time}
</td>

</tr>

`;

});


html+=
"</table>";


box.innerHTML=
html;


}catch(error){

box.innerHTML=
"❌ Records load नहीं हुए";

}

}

</script>

</body>
</html>
