<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soumya Dairy</title>


<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
}
header{
    background:#0f172a;
    color:white;
    text-align:center;
    padding:18px;
    font-size:25px;
    font-weight:bold;
}
.container{
    max-width:700px;
    margin:25px auto;
    padding:15px;
}
.card{
    background:white;
    padding:22px;
    border-radius:15px;
    box-shadow:0 4px 15px #bbb;
    margin-bottom:20px;
}
input,select,button{
    width:100%;
    padding:13px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}
button{
    background:#2563eb;
    color:white;
    border:0;
    font-weight:bold;
}
button.logout{background:#dc2626}
button.delete{background:#dc2626;padding:8px}
.hidden{display:none}
h2{text-align:center}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}
th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}
th{background:#e2e8f0}
.message{
    text-align:center;
    font-weight:bold;
    margin:10px;
}
</style>
</head>


<body>


<header>🐃 SOUMYA DAIRY</header>


<div class="container">


<!-- LOGIN -->
<div id="loginBox" class="card">
<h2>🔐 Login</h2>


<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">


<button onclick="login()">Login</button>


<div id="loginMsg" class="message"></div>
</div>




<!-- WORKER PANEL -->
<div id="workerPanel" class="hidden">


<div class="card">
<h2>👷 Worker Entry</h2>


<p>आज की अधिकतम <b>2 Entry</b> की जा सकती हैं।</p>


<input id="customer" placeholder="ग्राहक का नाम">


<input id="quantity" type="number" placeholder="दूध की मात्रा (लीटर)" step="0.1">


<select id="animal">
<option value="">पशु चुनें</option>
<option value="भैंस">भैंस</option>
<option value="गाय">गाय</option>
</select>


<button onclick="saveEntry()">💾 Save Entry</button>


<div id="workerMsg" class="message"></div>
</div>


<div class="card">
<h2>📋 मेरी आज की Entry</h2>


<table>
<thead>
<tr>
<th>नाम</th>
<th>लीटर</th>
<th>पशु</th>
<th>समय</th>
</tr>
</thead>


<tbody id="myEntries"></tbody>
</table>
</div>


<button class="logout" onclick="logout()">Logout</button>


</div>




<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">


<div class="card">
<h2>👑 Admin Panel</h2>


<p><b>Admin:</b> im9208455049@gmail.com</p>


<button onclick="loadAllEntries()">🔄 सभी Entry देखें</button>


<table>
<thead>
<tr>
<th>Worker</th>
<th>नाम</th>
<th>लीटर</th>
<th>पशु</th>
<th>समय</th>
<th>Delete</th>
</tr>
</thead>


<tbody id="allEntries"></tbody>
</table>


</div>


<button class="logout" onclick="logout()">Logout</button>


</div>


</div>




<!-- FIREBASE -->
<script type="module">


import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where,
    deleteDoc,
    doc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";




/* ==============================
   अपना Firebase Config यहाँ डालें
   ============================== */


const firebaseConfig = {


    apiKey: "YOUR_API_KEY",


    authDomain: "YOUR_PROJECT.firebaseapp.com",


    projectId: "YOUR_PROJECT_ID",


    storageBucket: "YOUR_PROJECT.firebasestorage.app",


    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",


    appId: "YOUR_APP_ID"


};




const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getFirestore(app);




/* ADMIN EMAIL */


const ADMIN_EMAIL = "im9208455049@gmail.com";




/* LOGIN */


window.login = async function(){


    const email =
        document.getElementById("email").value.trim();


    const password =
        document.getElementById("password").value;


    const msg =
        document.getElementById("loginMsg");


    msg.innerText = "Login हो रहा है...";


    try{


        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        msg.innerText = "";


    }catch(error){


        msg.innerText =
            "❌ Email या Password गलत है";


        console.log(error);


    }


};




/* AUTH CHECK */


onAuthStateChanged(auth, async(user)=>{


    if(!user){


        document.getElementById("loginBox")
            .classList.remove("hidden");


        document.getElementById("workerPanel")
            .classList.add("hidden");


        document.getElementById("adminPanel")
            .classList.add("hidden");


        return;
    }




    document.getElementById("loginBox")
        .classList.add("hidden");




    if(user.email === ADMIN_EMAIL){


        document.getElementById("adminPanel")
            .classList.remove("hidden");


        loadAllEntries();


    }else{


        document.getElementById("workerPanel")
            .classList.remove("hidden");


        loadMyEntries();


    }


});




/* TODAY */


function today(){


    const d = new Date();


    return d.getFullYear() + "-" +
        String(d.getMonth()+1).padStart(2,"0") + "-" +
        String(d.getDate()).padStart(2,"0");


}




/* SAVE WORKER ENTRY */


window.saveEntry = async function(){


    const user = auth.currentUser;


    if(!user) return;




    const customer =
        document.getElementById("customer")
        .value.trim();


    const quantity =
        document.getElementById("quantity")
        .value;


    const animal =
        document.getElementById("animal")
        .value;


    const msg =
        document.getElementById("workerMsg");




    if(!customer || !quantity || !animal){


        msg.innerText =
            "⚠️ सभी जानकारी भरें";


        return;


    }




    /* आज की entries check */


    const q = query(
        collection(db,"entries"),
        where("workerId","==",user.uid),
        where("date","==",today())
    );


    const snap = await getDocs(q);




    if(snap.size >= 2){


        msg.innerText =
            "❌ आज की 2 Entry पूरी हो चुकी हैं";


        return;


    }




    try{


        await addDoc(
            collection(db,"entries"),
            {


                workerId:user.uid,


                workerEmail:user.email,


                customer:customer,


                quantity:Number(quantity),


                animal:animal,


                date:today(),


                time:new Date().toLocaleTimeString(
                    "hi-IN"
                ),


                createdAt:serverTimestamp()


            }
        );




        msg.innerText =
            "✅ Entry Save हो गई";


        document.getElementById("customer")
            .value="";


        document.getElementById("quantity")
            .value="";


        document.getElementById("animal")
            .value="";




        loadMyEntries();




    }catch(error){


        console.log(error);


        msg.innerText =
            "❌ Entry Save नहीं हुई";


    }


};




/* WORKER ENTRIES */


async function loadMyEntries(){


    const user = auth.currentUser;


    if(!user) return;




    const q = query(
        collection(db,"entries"),
        where("workerId","==",user.uid),
        where("date","==",today())
    );




    const snap = await getDocs(q);


    const tbody =
        document.getElementById("myEntries");


    tbody.innerHTML="";




    snap.forEach(item=>{


        const e=item.data();


        tbody.innerHTML += `


        <tr>


        <td>${e.customer}</td>


        <td>${e.quantity}</td>


        <td>${e.animal}</td>


        <td>${e.time}</td>


        </tr>


        `;


    });


}




/* ADMIN ALL ENTRIES */


window.loadAllEntries = async function(){


    const snap =
        await getDocs(
            collection(db,"entries")
        );




    const tbody =
        document.getElementById("allEntries");


    tbody.innerHTML="";




    snap.forEach(item=>{


        const e=item.data();


        tbody.innerHTML += `


        <tr>


        <td>${e.workerEmail}</td>


        <td>${e.customer}</td>


        <td>${e.quantity}</td>


        <td>${e.animal}</td>


        <td>${e.date}<br>${e.time}</td>


        <td>


        <button
        class="delete"
        onclick="deleteEntry('${item.id}')">


        Delete


        </button>


        </td>


        </tr>


        `;


    });


};




/* ADMIN DELETE */


window.deleteEntry = async function(id){


    if(!confirm("क्या यह Entry Delete करनी है?"))
        return;




    try{


        await deleteDoc(
            doc(db,"entries",id)
        );


        alert("Entry Delete हो गई");


        loadAllEntries();


    }catch(error){


        alert("Delete नहीं हुई");


        console.log(error);


    }


};




/* LOGOUT */


window.logout = async function(){


    await signOut(auth);


};


</script>


</body>
</html>
